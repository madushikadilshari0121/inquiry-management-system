services:
  db:
    image: postgres:16
    container_name: inquiry_db
    environment:
      POSTGRES_USER: inquiry_user
      POSTGRES_PASSWORD: inquiry_pass
      POSTGRES_DB: inquiry_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d

volumes:
  pgdata: